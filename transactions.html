<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimplyMeds - Riwayat Transaksi</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    .page-content { padding: 20px; height: calc(100% - 70px); overflow-y: auto; }
    .table-container { background: var(--panel-white); border-radius: var(--radius-md); border: 1px solid var(--border-color); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 15px; border-bottom: 1px solid var(--border-color); }
    th { background-color: #f9f9f9; font-weight: 600; color: var(--text-secondary); }
    .badge-status { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #D1FAE5; color: #065F46; }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand" style="font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 20px;">Simply<br>Meds</div>
      </div>
      <div class="sidebar-menu">
        <div class="nav-item" onclick="window.location.href='dashboard.html'"><i data-lucide="home"></i></div>
        <div class="nav-item" onclick="window.location.href='pos.html'"><i data-lucide="shopping-bag"></i></div>
        <div class="nav-item" onclick="window.location.href='customers.html'"><i data-lucide="users"></i></div>
        <div class="nav-item active" onclick="window.location.href='transactions.html'"><i data-lucide="file-text"></i></div>
        <div class="nav-item" onclick="window.location.href='medicines.html'"><i data-lucide="pill"></i></div>
        <div class="nav-item" onclick="window.location.href='inventory.html'"><i data-lucide="package"></i></div>       
        </div>
      <div class="sidebar-bottom">
        <div class="nav-item"><i data-lucide="power"></i></div>
        <img src="https://i.pravatar.cc/150?img=11" alt="User" class="avatar">
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-wrapper">
      <header class="header">
        <div class="header-left"><h1>Riwayat Transaksi</h1></div>
      </header>

      <div class="page-content">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID Transaksi</th>
                <th>Tanggal & Waktu</th>
                <th>Kasir</th>
                <th>Total Belanja</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="transaction-list">
              <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  
  <script src="js/transactions.js" type="module"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
